name: flutter_examples
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  socket_io_client: ^3.1.6
  sqflite: ^2.4.4+2
  sqflite_common_ffi: ^2.4.4
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  leak_tracker_flutter_testing: ^3.0.10

flutter:
  uses-material-design: true

  # #docregion assets
  # Only files directly inside a listed directory are bundled. The 2.0x and
  # 3.0x variants of leaf.png are picked up automatically from the main entry.
  assets:
    - assets/images/
    - assets/data/

  fonts:
    - family: RobotoCondensed
      fonts:
        - asset: fonts/RobotoCondensed-Regular.ttf
        - asset: fonts/RobotoCondensed-Bold.ttf
          weight: 700
  # #enddocregion assets
